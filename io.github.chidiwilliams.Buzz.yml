app-id: io.github.chidiwilliams.Buzz
runtime: org.kde.Platform
runtime-version: '6.9'
sdk: org.kde.Sdk
command: buzz
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  # To save OpenAI API key
  - --talk-name=org.freedesktop.secrets
  # For NVIDIA GPU acceleration
  - --device=dri
  - --share=network
  - --share=ipc
  # For user to select files to transcribe
  - --filesystem=xdg-desktop
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --filesystem=xdg-music
  - --filesystem=xdg-videos
  # CUDA libraries
  - --env=LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/app/lib/python3.12/site-packages/nvidia/cudnn/lib:/app/lib/python3.12/site-packages/nvidia/cublas/lib

modules:
  - buzz-pip-dependencies.json

  # Borrowed from https://github.com/flathub/org.audacityteam.Audacity/blob/master/org.audacityteam.Audacity.yaml
  - name: portaudio
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: archive
        url: https://github.com/PortAudio/portaudio/archive/refs/tags/v19.7.0.tar.gz
        sha256: 5af29ba58bbdbb7bbcefaaecc77ec8fc413f0db6f4c4e286c40c3e1b83174fa0

  # Borrowed from https://github.com/flathub/org.freedownloadmanager.Manager/pull/20/files
  - name: kerberos
    subdir: src
    sources:
      - type: archive
        url: https://kerberos.org/dist/krb5/1.21/krb5-1.21.tar.gz
        sha256: 69f8aaff85484832df67a4bbacd99b9259bd95aab8c651fbbe65cdc9620ea93b

  # Buzz app
  - name: buzz-captions
    buildsystem: simple
    build-commands:
      # Note: Installing with --no-deps to ignore dependency mismatch with nemo-toolkit[asr] for bitsandbytes
      #       The --no-deps could be removed if some later version of nemo-toolkit[asr] updated bitsandbytes
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} --no-build-isolation --no-deps buzz-captions
    sources:
      - type: file
        url: https://github.com/chidiwilliams/buzz/releases/download/v1.4.4/buzz_captions-1.4.4-py3-none-manylinux_2_34_x86_64.whl
        sha256: 6994b5bb1f891f475ceb5100503b22af9c70d26e1378f59e16ca7f62e437d22f

  - name: Buzz
    buildsystem: simple
    build-commands:
      - install -Dm644 io.github.chidiwilliams.Buzz.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - sed -i "s/^Icon=Buzz\$/Icon=${FLATPAK_ID}/" Buzz.desktop
      - install -Dm644 Buzz.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml

      # Create directory for KStyle extension
      - mkdir -p ${FLATPAK_DEST}/share/kstyle

    sources:
      - type: file
        url: https://raw.githubusercontent.com/chidiwilliams/buzz/20775d345cde780ffe26f600469d21416e15c682/share/icons/io.github.chidiwilliams.Buzz.svg
        sha256: 0aac4a0dbedc4cac1ecbbee027b08f9fe82a566c502a273074bf44c31de6e14b
      - type: file
        url: https://raw.githubusercontent.com/chidiwilliams/buzz/0369146be2f9795b752e4ac00d28256001ab5da9/Buzz.desktop
        sha256: ec3e417d9d6a425944d936605496200bd573d5432428ca2a863b127988fd9abc
      - type: file
        url: https://raw.githubusercontent.com/chidiwilliams/buzz/1346c68c72e1e80f4d7fc01cc365b1b833e516f8/share/metainfo/io.github.chidiwilliams.Buzz.metainfo.xml
        sha256: 2f28e275928da0ba1de6f0923beb650cd0ac407717534db53ed5fca4fe2a3331

add-extensions:
  org.kde.KStyle.Adwaita:
    directory: share/kstyle
    version: '6.9'
    subdirectories: true
    autodelete: false